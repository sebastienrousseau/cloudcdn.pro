name: Generate Asset Manifest
on:
  push:
    branches: [main]
    paths:
      - '**/images/**'
      - '**/*.png'
      - '**/*.webp'
      - '**/*.avif'
      - '**/*.svg'
      - '**/*.ico'
  workflow_run:
    workflows: ["Compress Images"]
    types: [completed]
  workflow_dispatch:

# Least-privilege default; the job below opts into the writes it needs.
permissions: {}

jobs:
  build:
    name: Regenerate manifest + open PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents:write + pull-requests:write are consumed by
    # peter-evans/create-pull-request, not by a direct push. Branch
    # protection on `main` requires 7 status checks and enforce_admins
    # is false, so the default GITHUB_TOKEN cannot PATCH the ref
    # directly (HTTP 422). Opening a PR — the same pattern as
    # cron-refresh-dist.yml — lands the change through the gate instead.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build manifest + path types
        run: node scripts/generate-manifest.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet manifest.json cloudcdn-paths.d.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Manifest already in sync — nothing to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Manifest drift — pending PR"
              echo ""
              echo "\`\`\`diff"
              git -c color.diff=never diff --stat manifest.json cloudcdn-paths.d.ts
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Resolve release iteration
        if: steps.diff.outputs.changed == 'true'
        id: release
        run: |
          current="$(node -p "require('./package.json').version")"
          version="$(node scripts/release/next-version.mjs)"
          {
            echo "current=$current"
            echo "version=$version"
            echo "branch=feat/v$version"
          } >> "$GITHUB_OUTPUT"

      - name: Open / update the manifest PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v7
        with:
          branch: ${{ steps.release.outputs.branch }}
          delete-branch: true
          base: main
          add-paths: |
            manifest.json
            cloudcdn-paths.d.ts
          commit-message: 'chore: refresh asset manifest'
          # sign-commits uses the GitHub Apps API so github-actions[bot]
          # produces a verified signature — required by the repo's
          # verify-signatures merge gate.
          sign-commits: true
          title: 'feat: prepare v${{ steps.release.outputs.version }}'
          body: |
            Hi Sebastien,

            This PR prepares CloudCDN v${{ steps.release.outputs.version }}.

            Asset metadata and generated path types now match the committed files.

            ## Highlights ⭐️

            * **Asset manifest**: Regenerates metadata after asset changes.
            * **Path types**: Updates generated path declarations with the same source data.
            * **Release branch**: Routes generated files through the next CloudCDN iteration.

            ## What's Changed

            * Refresh the asset manifest by @github-actions[bot]

            ## Validation

            * `node scripts/generate-manifest.mjs`: completed.
            * Generated files differ from `main` and are included in the commit.

            ## Checksums

            ```
            No release artifacts are produced by this workflow.
            ```

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/v${{ steps.release.outputs.current }}...${{ steps.release.outputs.branch }}
          labels: |
            auto
            manifest
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          signoff: false
