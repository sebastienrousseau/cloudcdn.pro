name: Compress Images
on:
  push:
    branches: [main]
    paths:
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '!scripts/tests/visual/**'
  workflow_dispatch:

permissions: {}

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents:write + pull-requests:write are consumed by
    # peter-evans/create-pull-request. Branch protection on `main`
    # requires 7 status checks (enforce_admins false), so the default
    # GITHUB_TOKEN cannot PATCH the ref directly (HTTP 422) — we open a
    # PR instead, mirroring cron-refresh-dist.yml.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Find and convert new images
        run: |
          node -e "
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');

          const diff = execSync('git diff --name-only --diff-filter=A HEAD~1 HEAD').toString().trim();
          if (!diff) { console.log('No new files'); process.exit(0); }

          const files = diff.split('\n').filter(f =>
            /\.(png|jpe?g)$/i.test(f) &&
            !f.startsWith('scripts/tests/visual/') &&
            fs.existsSync(f)
          );

          if (files.length === 0) { console.log('No new images to convert'); process.exit(0); }

          (async () => {
            for (const file of files) {
              const base = file.replace(/\.(png|jpe?g)$/i, '');
              const webpOut = base + '.webp';
              const avifOut = base + '.avif';

              const jxlOut = base + '.jxl';

              try {
                if (!fs.existsSync(webpOut)) {
                  await sharp(file).webp({ quality: 80 }).toFile(webpOut);
                  console.log('WebP:', webpOut);
                }
                if (!fs.existsSync(avifOut)) {
                  await sharp(file).avif({ quality: 65 }).toFile(avifOut);
                  console.log('AVIF:', avifOut);
                }
                if (!fs.existsSync(jxlOut)) {
                  await sharp(file).jxl({ quality: 75 }).toFile(jxlOut);
                  console.log('JXL:', jxlOut);
                }
              } catch (err) {
                console.error('Error converting', file, err.message);
              }
            }
          })();
          "

      - name: Check for new conversions
        id: diff
        run: |
          set -euo pipefail
          # Any format may have zero matches — JXL in particular requires a
          # libjxl-enabled libvips not present in the sharp npm prebuilt, so
          # .jxl outputs are never produced today.
          if git ls-files -mo --exclude-standard | grep -qE '\.(webp|avif|jxl)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new conversions."
          fi

      - name: Resolve release iteration
        if: steps.diff.outputs.changed == 'true'
        id: release
        run: |
          current="$(node -p "require('./package.json').version")"
          version="$(node scripts/release/next-version.mjs)"
          {
            echo "current=$current"
            echo "version=$version"
            echo "branch=feat/v$version"
          } >> "$GITHUB_OUTPUT"

      - name: Open / update the conversions PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v7
        with:
          branch: ${{ steps.release.outputs.branch }}
          delete-branch: true
          base: main
          add-paths: |
            **/*.webp
            **/*.avif
          commit-message: 'chore: convert images'
          # sign-commits uses the GitHub Apps API so github-actions[bot]
          # produces a verified signature — required by the repo's
          # verify-signatures merge gate.
          sign-commits: true
          title: 'feat: prepare v${{ steps.release.outputs.version }}'
          body: |
            Hi Sebastien,

            This PR prepares CloudCDN v${{ steps.release.outputs.version }}.

            Newly added images now include optimized web delivery formats.

            ## Highlights ⭐️

            * **WebP output**: Converts new source images for broad browser support.
            * **AVIF output**: Adds compact modern variants where conversion succeeds.
            * **Release branch**: Routes generated assets through the next CloudCDN iteration.

            ## What's Changed

            * Convert new images by @github-actions[bot]

            ## Validation

            * Image conversion completed without an unhandled error.
            * Generated paths were detected before the commit step.

            ## Checksums

            ```
            No release artifacts are produced by this workflow.
            ```

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/v${{ steps.release.outputs.current }}...${{ steps.release.outputs.branch }}
          labels: |
            auto
            images
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          signoff: false
