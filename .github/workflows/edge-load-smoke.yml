name: Edge load smoke

# k6 smoke test (2 VUs, 10s) against the live cloudcdn.pro edge. It runs
# after each production deploy and daily, not on pull requests: a PR is
# not deployed, so a PR-time run measured production rather than the PR
# and failed PRs on unrelated edge blips (cloudcdn.pro#226). Budget
# failures still fail this workflow.

on:
  workflow_run:
    workflows: ['Deploy to Cloudflare Pages']
    types: [completed]
  schedule:
    # Daily 07:45 UTC, offset from the 07:15 edge header check.
    - cron: '45 7 * * *'
  workflow_dispatch:

concurrency:
  group: edge-load-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  load-test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install k6
        run: |
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Run k6 smoke test (2 VUs, 10s)
        # I_KNOW_THIS_HITS_PROD=1 is the explicit opt-in required by the
        # seatbelt in scripts/tests/load.k6.js. Keep VUs at 2 (~80 req/10s)
        # so the run stays below the Cloudflare 100 req/10s per-IP edge
        # rate limit.
        run: |
          k6 run \
            -e BASE_URL=https://cloudcdn.pro \
            -e I_KNOW_THIS_HITS_PROD=1 \
            --vus 2 \
            --duration 10s \
            --summary-trend-stats="avg,min,med,max,p(95),p(99)" \
            scripts/tests/load.k6.js
