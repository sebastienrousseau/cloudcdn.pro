name: Refresh /dist/ marketplace catalogue

# Synchronises every owned published GitHub release once a week, refreshes
# declared versions from npm / crates.io / PyPI / GitHub Releases, and opens
# a PR when the source catalogue or generated output changes.
# Keeps the marketplace versions fresh without a developer touching it.
#
# The PR is opened by github-actions[bot] and labelled `auto`, so it's
# easy to filter in the dependabot/automerge tooling later.
#
# Manual trigger is also wired for ad-hoc refreshes.

on:
  schedule:
    # Monday 06:00 UTC — early-week, after weekend dependency churn.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: refresh-dist-catalogue
  cancel-in-progress: false

permissions: {}

jobs:
  refresh:
    name: Refresh + open PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - name: Synchronise published GitHub releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run dist:sync-github

      - name: Regenerate the catalogue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/dist/generate-dist-catalogue.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet scripts/dist/packages-catalogue.json cdn/en/dist/_dist.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No version drift since last refresh."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # Surface a short summary so the workflow run page tells the
            # whole story without clicking through to the PR.
            {
              echo "## Catalogue refresh — pending PR"
              echo ""
              echo "\`\`\`diff"
              git -c color.diff=never diff --unified=0 cdn/en/dist/_dist.json \
                | grep -E '^[+-]' \
                | grep -v '^---' \
                | grep -v '^+++' \
                | head -200
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Resolve release iteration
        if: steps.diff.outputs.changed == 'true'
        id: release
        run: |
          current="$(node -p "require('./package.json').version")"
          version="$(node scripts/release/next-version.mjs)"
          {
            echo "current=$current"
            echo "version=$version"
            echo "branch=feat/v$version"
          } >> "$GITHUB_OUTPUT"

      - name: Open / update the refresh PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v7
        with:
          branch: ${{ steps.release.outputs.branch }}
          delete-branch: true
          base: main
          commit-message: 'chore: refresh marketplace catalogue'
          # sign-commits: true uses the GitHub Apps API to commit via
          # github-actions[bot], which produces a GitHub-verified
          # signature. Without this, the repo's verify-signatures gate
          # blocks the auto-PR from merging.
          sign-commits: true
          title: 'feat: prepare v${{ steps.release.outputs.version }}'
          body: |
            Hi Sebastien,

            This PR prepares CloudCDN v${{ steps.release.outputs.version }}.

            The marketplace now reflects the latest published package and application releases.

            ## Highlights ⭐️

            * **GitHub discovery**: Adds newly published owned repositories.
            * **Registry versions**: Refreshes npm, crates.io, PyPI, and GitHub release versions.
            * **Release branch**: Routes the update through the next CloudCDN iteration.

            ## What's Changed

            * Refresh the marketplace catalogue by @github-actions[bot]

            ## Validation

            * `npm run dist:sync-github`: completed.
            * `node scripts/dist/generate-dist-catalogue.mjs`: completed.

            ## Checksums

            ```
            No release artifacts are produced by this workflow.
            ```

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/v${{ steps.release.outputs.current }}...${{ steps.release.outputs.branch }}
          labels: |
            auto
            dist
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          signoff: false
